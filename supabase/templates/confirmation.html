<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;background:#eef1f5;font-family:Tahoma,Arial,sans-serif;color:#17243c;direction:rtl">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f5;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e2dc;border-radius:18px;overflow:hidden">
          <tr><td align="center" style="background:#0b1932;padding:28px 24px;color:#e4c486">
            <div style="font-size:25px;font-weight:bold;letter-spacing:2px" dir="ltr">FBS</div>
            <div style="font-size:14px;line-height:1.8">فارس بن سعود للوحات المميزة</div>
          </td></tr>
          <tr><td align="right" style="padding:32px 28px">
            <h1 style="font-size:21px;line-height:1.6;margin:0 0 14px;color:#0b1932">رمز تفعيل حسابك</h1>
            <p style="font-size:15px;line-height:1.9;margin:0 0 22px;color:#46536a">أدخل رمز التحقق التالي في صفحة التسجيل لإكمال إنشاء حسابك:</p>
            <div dir="ltr" style="border:1px solid #e5c889;border-radius:12px;background:#fbf7ed;padding:18px;text-align:center;font-size:30px;font-weight:bold;letter-spacing:6px;color:#10213d">{{ .Token }}</div>
            <p style="font-size:13px;line-height:1.9;margin:22px 0 0;color:#617087">الرمز صالح لفترة محدودة ولا تشاركه مع أي شخص. إذا لم تطلب إنشاء حساب، يمكنك تجاهل هذه الرسالة.</p>
          </td></tr>
          <tr><td align="center" style="border-top:1px solid #edf0f3;padding:18px 24px;color:#7a8799;font-size:12px">منصة فارس بن سعود للوحات المميزة</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
